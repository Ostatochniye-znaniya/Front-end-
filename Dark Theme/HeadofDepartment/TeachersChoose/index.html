    <!-- Основное содержимое -->
    <div class="content">
        <h1>Выбор преподавателей</h1>
        <label for="my-dropdown" style="margin-right: 10px; color: white; font-weight: 500;";">Группа:</label>
        <select id="my-dropdown" name="my-dropdown" class="rounded-slct">

        <label for="my-dropdown" style="margin-right: 10px; color: white; font-weight: 500;";">Дисциплина:</label>
        <select id="my-dropdown" name="my-dropdown" class="rounded-slct">

            <option value="opt3">Опция 3</option>
        </select>
        <table id="teachers_table">
            <thead>
                <tr>
                    <th style="border-radius: 10px 0px 0px 0px;">Группа</th>
                    <th>Дисциплина</th>
                    <th style="border-radius: 0px 10px 0px 0px;">Преподаватель</th>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>

</body>
<script>
const tbody = document.querySelector('#teachers_table tbody');

function createRow() {
  const row = document.createElement('tr');
  tbody.appendChild(row);
  return row;
}

function addToRow(row, data) {
  const nameCell = document.createElement('td');
  nameCell.textContent = data; 
  row.appendChild(nameCell);
}

function makeRequest(testing, report)  {
  if(report){
    fetch(`http://localhost:5134/Report/ReportDisciplineIdUpdate/${report.id}`,{
      method: 'PATCH',
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ disciplineId: testing.disciplineId})
    })
  }
}

function addButtonToRow(row, testing, report) {
    const cell = document.createElement('td');
    
    const button = document.createElement('button');
    button.textContent = `Отправить запрос`;
    button.className = 'rounded-btn';
    
    button.addEventListener('click', function() {
      makeRequest(testing, report)
      button.disabled = true;
      button.textContent = `Запрос отправлен`;
    });
    if(currentReport.disciplineId != 0 && currentReport.disciplineId != null){
      button.disabled = true;
      button.textContent = `Запрос отправлен`;
    }
    cell.appendChild(button);
    row.appendChild(cell);
}

let currentUserData = null;
let currentReport = null;

fetch(`http://localhost:5134/User/GetCurrentUserDataTest/current`)
  .then(response => response.json())
  .then(userData => {
    currentUserData = userData;
    return fetch(`http://localhost:5134/Testing/GetTestingsByDepartment/department/${userData.departmentId}`);
  })
  .then(response => response.json())
  .then(testings => {
    const promises = testings.map(testing => {
  return new Promise((resolve) => {
    const curRow = createRow();
    let showButton = false;
    
    fetch(`http://localhost:5134/StudyGroup/GetById/${testing.groupId}`)
      .then(groupResponse => groupResponse.json())
      .then(group => {
        addToRow(curRow, group.groupNumber);
        return fetch(`http://localhost:5134/Discipline/GetDisciplineById/${testing.disciplineId}`);
      })
      .then(disciplineResponse => disciplineResponse.json())
      .then(discipline => {
        addToRow(curRow, discipline.name);
        if(currentUserData.departmentId === discipline.departmentId){
          showButton = false;
        }
        else
        {
          showButton = true;
        }
        return fetch(`http://localhost:5134/Report/GetReportById/${testing.reportId}`);
      })
      .then(reportResponse => {
        return reportResponse ? reportResponse.json() : null;
      })
      .then(report => {
        currentReport = report;
        if (showButton || !report) {
          return Promise.resolve(null);
        }
        return fetch(`http://localhost:5134/User/GetUserById/${report.teacherId}`);
      })
      .then(teacherResponse => {
        if (showButton || !teacherResponse) {
          return Promise.resolve(null);
        }
        return teacherResponse.json();
      })
      .then(teacher => {
        if (showButton) {
          addButtonToRow(curRow, testing, currentReport);
        } else if (teacher) {
          addToRow(curRow, teacher.name);
        } else {
          addToRow(curRow, "N/A");
        }
        resolve();
      })
      .catch(error => {
        console.error(`Error for testing ${testing.id}:`, error);
        resolve();
      });
  });
});
    
    return Promise.all(promises);
  })
  .catch(error => {
    console.error('Common error:', error);
  });
</script>
