<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка остаточных знаний</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="recommendation_styles.css">
    <link rel="stylesheet" type="text/css" href="groups_page_style.css">
</head>
<body>
    <div class="sidebar">
        <img src="Polytech_darktheme.png" id="1">
        <div class="line"></div>
        <h1>Проверка<br>остаточных знаний</h1>
        <img src="Circle.png" style="top: 20%; width: 7%; height: 11.7%; margin-left: 3.85%;">
        <h2>Иванов<br>Иван Иванович</h2>
    
        <a href="" style="color: #B2BAF9; font-weight: 800;">Главная</a>
        <div class="purple_circle"></div>
        <a href="" style="top: 47%;">Приказы</a>
        <a href="" style="top: 52%;">Списки<br>рекомендованных<br>групп</a>
        <a href="" style="top: 63%;">Отчёты</a>
        <a href="" style="top: 68%;">Настройки<br>доступа</a>
    </div>

    <div class="content">
        <h1>Список групп</h1>
        <div class="records-count" id="recordsCount">
            Найдено записей: 0
        </div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th style="border-radius: 10px 0px 0px 0px;">Номер группы</th>
                        <th>Название направления</th>
                        <th>Курс</th>
                        <th>Шифр направления</th>
                        <th style="border-radius: 0px 10px 0px 0px;">Действия</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
        
        <div class="generate-btn-container">
            <button class="filter-btn apply-btn" id="addBtn">Добавить</button>
        </div>
    </div>
    <div id="createGroupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Создание новой группы</div>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            
            <form id="createGroupForm">
                <div class="form-group">
                    <label class="form-label" for="groupNumber">Номер группы:</label>
                    <input type="text" id="groupNumber" class="form-input" required 
                           placeholder="Например: 123-456">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="studyProgram">Направление:</label>
                    <select id="studyProgram" class="form-select" required>
                        <option value="">Выберите направление</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="modal-btn cancel-btn" id="cancelBtn">Отмена</button>
                    <button type="submit" class="modal-btn save-btn" id="saveBtn">Создать</button>
                </div>
            </form>
        </div>
    </div>

    <div id="updateGroupModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Редактирование группы</div>
                <button class="close-btn" id="closeUpdateModalBtn">&times;</button>
            </div>
            
            <form id="updateGroupForm">
                <input type="hidden" id="updateGroupId">
                
                <div class="form-group">
                    <label class="form-label" for="updateGroupNumber">Номер группы:</label>
                    <input type="text" id="updateGroupNumber" class="form-input" required 
                           placeholder="Например: 123-456">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="updateStudyProgram">Направление:</label>
                    <select id="updateStudyProgram" class="form-select" required>
                        <option value="">Выберите направление</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="modal-btn cancel-btn" id="cancelUpdateBtn">Отмена</button>
                    <button type="submit" class="modal-btn save-btn" id="updateBtn">Обновить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:5134';
        const tableBody = document.getElementById('tableBody');
        const addBtn = document.getElementById('addBtn');
        
        const createModal = document.getElementById('createGroupModal');
        const closeCreateModalBtn = document.getElementById('closeModalBtn');
        const cancelCreateBtn = document.getElementById('cancelBtn');
        const createGroupForm = document.getElementById('createGroupForm');
        const studyProgramSelect = document.getElementById('studyProgram');
        const groupNumberInput = document.getElementById('groupNumber');
        const saveBtn = document.getElementById('saveBtn');
        
        const updateModal = document.getElementById('updateGroupModal');
        const closeUpdateModalBtn = document.getElementById('closeUpdateModalBtn');
        const cancelUpdateBtn = document.getElementById('cancelUpdateBtn');
        const updateGroupForm = document.getElementById('updateGroupForm');
        const updateStudyProgramSelect = document.getElementById('updateStudyProgram');
        const updateGroupNumberInput = document.getElementById('updateGroupNumber');
        const updateGroupIdInput = document.getElementById('updateGroupId');
        const updateBtn = document.getElementById('updateBtn');
        
        let studyPrograms = [];
        let currentGroups = [];
        
        async function loadGroups() {
            try {
                showLoading();
                
                const response = await fetch(`${API_BASE_URL}/StudyGroup/GetAll`);
                
                if (response.ok) {
                    const groups = await response.json();
                    currentGroups = groups;
                    updateTable(groups);
                } else {
                    showNoData();
                }
            } catch (error) {
                console.error('Ошибка загрузки групп:', error);
                showNoData();
            }
        }
        
        async function loadStudyPrograms() {
            try {
                const response = await fetch(`${API_BASE_URL}/StudyProgram/GetAll`);
                
                if (response.ok) {
                    studyPrograms = await response.json();
                    
                    studyProgramSelect.innerHTML = '<option value="">Выберите направление</option>';
                    updateStudyProgramSelect.innerHTML = '<option value="">Выберите направление</option>';
                    
                    studyPrograms.forEach(program => {
                        const option1 = document.createElement('option');
                        option1.value = program.id;
                        option1.textContent = program.name;
                        studyProgramSelect.appendChild(option1);
                        
                        const option2 = document.createElement('option');
                        option2.value = program.id;
                        option2.textContent = program.name;
                        updateStudyProgramSelect.appendChild(option2);
                    });
                }
            } catch (error) {
                console.error('Ошибка загрузки программ обучения:', error);
                alert('Не удалось загрузить список направлений');
            }
        }
        
        function updateTable(groups) {
            tableBody.innerHTML = '';
            
            if (!groups || groups.length === 0) {
                showNoData();
                return;
            }
            
            groups.forEach(group => {
                const row = document.createElement('tr');
                
                const groupNumber = group.groupNumber || group.name || '-';
                const programName = group.studyProgram ? group.studyProgram.name : '-';
                const course = calculateCourse(groupNumber);
                const programCypher = group.studyProgram ? group.studyProgram.cypherOfTheDirection : '-';
                const studyProgramId = group.studyProgram ? group.studyProgram.id : (group.studyProgramId || 0);
                
                row.innerHTML = `
                    <td>${groupNumber}</td>
                    <td>${programName}</td>
                    <td>${course}</td>
                    <td>${programCypher}</td>
                    <td>
                        <div class="btn-group">
                            <button class="update-btn" data-id="${group.id}" 
                                    data-number="${groupNumber}" 
                                    data-program="${studyProgramId}">Обновить</button>
                            <button class="delete-btn" data-id="${group.id}">Удалить</button>
                        </div>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
            
            updateRecordsCount(groups.length);
            
            document.querySelectorAll('.delete-btn').forEach(button => {
                button.addEventListener('click', async (event) => {
                    const groupId = event.target.getAttribute('data-id');
                    const groupName = event.target.closest('tr').cells[0].textContent;
                    
                    if (confirm(`Вы уверены, что хотите удалить группу "${groupName}"?`)) {
                        await deleteGroup(groupId);
                    }
                });
            });
            
            document.querySelectorAll('.update-btn').forEach(button => {
                button.addEventListener('click', async (event) => {
                    const groupId = event.target.getAttribute('data-id');
                    const groupNumber = event.target.getAttribute('data-number');
                    const studyProgramId = event.target.getAttribute('data-program');
                    
                    openUpdateModal(groupId, groupNumber, studyProgramId);
                });
            });
        }
        
        async function deleteGroup(groupId) {
            try {
                const response = await fetch(`${API_BASE_URL}/StudyGroup/Delete/${groupId}`, {
                    method: 'DELETE',
                });
                
                if (response.ok) {
                    alert('Группа успешно удалена');
                    loadGroups();
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка при удалении группы: ${errorText}`);
                }
            } catch (error) {
                console.error('Ошибка удаления группы:', error);
                alert('Ошибка при удалении группы');
            }
        }
        
        async function createGroup(groupData) {
            try {
                saveBtn.disabled = true;
                saveBtn.textContent = 'Создание...';
                
                const response = await fetch(`${API_BASE_URL}/StudyGroup/Create`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(groupData)
                });
                
                if (response.ok) {
                    alert('Группа успешно создана');
                    closeCreateModal();
                    loadGroups();
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка при создании группы: ${errorText}`);
                }
            } catch (error) {
                console.error('Ошибка создания группы:', error);
                alert('Ошибка при создании группы');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Создать';
            }
        }
        
        async function updateGroup(groupId, groupData) {
            try {
                updateBtn.disabled = true;
                updateBtn.textContent = 'Обновление...';
                
                const response = await fetch(`${API_BASE_URL}/StudyGroup/Update/${groupId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(groupData)
                });
                
                if (response.ok) {
                    alert('Группа успешно обновлена');
                    closeUpdateModal();
                    loadGroups();
                } else {
                    const errorText = await response.text();
                    alert(`Ошибка при обновлении группы: ${errorText}`);
                }
            } catch (error) {
                console.error('Ошибка обновления группы:', error);
                alert('Ошибка при обновлении группы');
            } finally {
                updateBtn.disabled = false;
                updateBtn.textContent = 'Обновить';
            }
        }
        
        function calculateCourse(groupNumber) {
            if (!groupNumber) return '-';
            
            const parts = groupNumber.split('-');
            if (parts.length < 2) return '-';
            
            const beforeDash = parts[0];
            if (beforeDash.length < 2) return '-';
            
            const lastTwo = beforeDash.slice(-2);
            if (!/^\d{2}$/.test(lastTwo)) return '-';
            
            const admissionYear = 2000 + parseInt(lastTwo);
            const now = new Date();
            const currentYear = now.getFullYear();
            const month = now.getMonth();
            
            const academicYear = month >= 8 ? currentYear : currentYear - 1;
            let course = academicYear - admissionYear;
            
            if (course < 1) return 1;
            if (course > 5) return 5;
            
            return course;
        }
        
        function updateRecordsCount(count) {
            const recordsCountElement = document.getElementById('recordsCount');
            if (recordsCountElement) {
                recordsCountElement.textContent = `Найдено записей: ${count}`;
            }
        }
        
        function openCreateModal() {
            createModal.style.display = 'block';
            loadStudyPrograms();
            createGroupForm.reset();
        }
        
        function closeCreateModal() {
            createModal.style.display = 'none';
            createGroupForm.reset();
        }
        
        function openUpdateModal(groupId, groupNumber, studyProgramId) {
            updateModal.style.display = 'block';
            
            loadStudyPrograms().then(() => {
                updateGroupIdInput.value = groupId;
                updateGroupNumberInput.value = groupNumber;
                const programIdNumber = parseInt(studyProgramId);
                if (programIdNumber > 0) {
                    updateStudyProgramSelect.value = programIdNumber;
                } else {
                    updateStudyProgramSelect.value = "";
                }
            });
        }
        
        function closeUpdateModal() {
            updateModal.style.display = 'none';
            updateGroupForm.reset();
        }
        
        function showLoading() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; padding: 40px; color: #aaa;">
                        Загрузка данных...
                    </td>
                </tr>
            `;
        }
        
        function showNoData() {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="5" style="text-align: center; padding: 40px; color: #aaa;">
                        Нет данных для отображения
                    </td>
                </tr>
            `;
            updateRecordsCount(0);
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            loadGroups();
            
            addBtn.addEventListener('click', openCreateModal);
            
            closeCreateModalBtn.addEventListener('click', closeCreateModal);
            cancelCreateBtn.addEventListener('click', closeCreateModal);
            
            closeUpdateModalBtn.addEventListener('click', closeUpdateModal);
            cancelUpdateBtn.addEventListener('click', closeUpdateModal);
            
            window.addEventListener('click', (event) => {
                if (event.target === createModal) {
                    closeCreateModal();
                }
                if (event.target === updateModal) {
                    closeUpdateModal();
                }
            });
            
            createGroupForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                const groupNumber = groupNumberInput.value.trim();
                const studyProgramId = parseInt(studyProgramSelect.value);
                
                if (!groupNumber) {
                    alert('Пожалуйста, введите номер группы');
                    return;
                }
                
                if (!studyProgramId) {
                    alert('Пожалуйста, выберите направление');
                    return;
                }
                
                const groupData = {
                    groupNumber: groupNumber,
                    studyProgramId: studyProgramId
                };
                
                await createGroup(groupData);
            });
            
            updateGroupForm.addEventListener('submit', async (event) => {
                event.preventDefault();
                
                const groupId = updateGroupIdInput.value;
                const groupNumber = updateGroupNumberInput.value.trim();
                const studyProgramId = parseInt(updateStudyProgramSelect.value);
                
                if (!groupNumber) {
                    alert('Пожалуйста, введите номер группы');
                    return;
                }
                
                if (!studyProgramId) {
                    alert('Пожалуйста, выберите направление');
                    return;
                }
                
                const groupData = {
                    groupNumber: groupNumber,
                    studyProgramId: studyProgramId
                };
                
                await updateGroup(groupId, groupData);
            });
        });
    </script>
</body>
</html>
