name: front-${INSTANCE:?set INSTANCE}

services:
  nextjs:
    build: ./frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    expose:
      - "3000"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/csh >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:?set HTTP_PORT}:80"
    environment:
      - BACKEND_HOST=${BACKEND_HOST:?set BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT:-8080}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      nextjs:
        condition: service_healthy
    networks: [internal, backend]

networks:
  internal: {}
  backend:
    external: true
    name: ${BACKEND_NETWORK:?set BACKEND_NETWORK}