name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_COMPOSE_VERSION: '2.23.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || (github.ref == 'refs/heads/main' && 'production') || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup SSH agent for DEV
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
    
    - name: Setup SSH agent for PROD
      if: github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/main'
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version
    
    - name: Set deployment variables
      id: vars
      run: |
        # Определяем окружение
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
          SERVER_HOST="${{ vars.PROD_SERVER_HOST }}"
          SERVER_USER="${{ vars.PROD_SERVER_USER }}"
          SERVER_PORT="${{ vars.PROD_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.PROD_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.PROD_COMPOSE_FILES }}"
        else
          ENVIRONMENT="dev"
          SERVER_HOST="${{ vars.DEV_SERVER_HOST }}"
          SERVER_USER="${{ vars.DEV_SERVER_USER }}"
          SERVER_PORT="${{ vars.DEV_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.DEV_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.DEV_COMPOSE_FILES }}"
        fi
        
        # Проверяем обязательные переменные
        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        # Устанавливаем значения по умолчанию
        SERVER_PORT="${SERVER_PORT:-22}"
        PROJECT_DIR="${PROJECT_DIR:-/opt/csh/frontend}"
        
        if [ "$ENVIRONMENT" == "prod" ]; then
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.prod.yml}"
        else
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.dev.yml}"
        fi
        
        # Сохраняем в output
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "server_host=$SERVER_HOST" >> $GITHUB_OUTPUT
        echo "server_user=$SERVER_USER" >> $GITHUB_OUTPUT
        echo "server_port=$SERVER_PORT" >> $GITHUB_OUTPUT
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
        echo "compose_files=$COMPOSE_FILES" >> $GITHUB_OUTPUT
        
        # Debug info
        echo "=== Deployment Configuration ==="
        echo "Environment: $ENVIRONMENT"
        echo "Server: $SERVER_USER@$SERVER_HOST:$SERVER_PORT"
        echo "Project directory: $PROJECT_DIR"
        echo "Compose files: $COMPOSE_FILES"
        echo "================================"
    
    - name: Prepare deployment package
      run: |
        # Создаем временную директорию для сборки
        mkdir -p deploy-package
        
        echo "📦 Copying project files..."
        
        # Копируем файлы проекта, исключая ненужные
        # Используем rsync если доступен, иначе find + cp
        if command -v rsync &> /dev/null; then
          rsync -av \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='deploy-package' \
            --exclude='deploy.tar.gz' \
            --exclude='.github' \
            --exclude='*.log' \
            --exclude='coverage' \
            --exclude='.next' \
            --exclude='dist' \
            --exclude='build' \
            ./ deploy-package/
        else
          # Используем tar для копирования
          find . -type f \
            -not -path "./.git/*" \
            -not -path "./node_modules/*" \
            -not -path "./deploy-package/*" \
            -not -path "./.github/*" \
            -not -name "*.log" \
            -print0 | tar -czf temp.tar.gz --null -T -
          tar -xzf temp.tar.gz -C deploy-package/
          rm temp.tar.gz
        fi
        
        echo "✅ Project files copied"
        
        # Создаем скрипт деплоя
        cat > deploy-package/deploy.sh << 'DEPLOY_SCRIPT'
        #!/bin/bash
        set -e
        
        echo "========================================="
        echo "🚀 Starting deployment..."
        echo "========================================="
        
        # Проверка Docker
        if ! command -v docker &> /dev/null; then
            echo "❌ Docker is not installed"
            exit 1
        fi
        
        if ! command -v docker-compose &> /dev/null; then
            echo "❌ Docker Compose is not installed"
            exit 1
        fi
        
        # Остановка и удаление старых контейнеров
        echo "📦 Stopping and removing existing containers..."
        if [ -f "docker-compose.dev.yml" ]; then
            docker-compose -f docker-compose.dev.yml down --remove-orphans || true
        fi
        
        if [ -f "docker-compose.yml" ]; then
            docker-compose -f docker-compose.yml down --remove-orphans || true
        fi
        
        # Очистка старых образов
        echo "🧹 Cleaning up old images..."
        docker system prune -af --volumes || true
        
        # Проверяем наличие Dockerfile
        if [ ! -f "Dockerfile" ]; then
            echo "❌ No Dockerfile found in current directory"
            echo "Current directory contents:"
            ls -la
            exit 1
        fi
        
        # Определяем какой compose файл использовать
        if [ -f "docker-compose.dev.yml" ]; then
            COMPOSE_FILE="docker-compose.dev.yml"
        elif [ -f "docker-compose.yml" ]; then
            COMPOSE_FILE="docker-compose.yml"
        else
            echo "❌ No docker-compose file found"
            exit 1
        fi
        
        echo "📋 Using compose file: $COMPOSE_FILE"
        
        # Сборка и запуск контейнеров
        echo "🔨 Building and starting containers..."
        docker-compose -f $COMPOSE_FILE up -d --build --force-recreate
        
        # Ожидание запуска
        echo "⏳ Waiting for containers to start..."
        sleep 15
        
        # Проверка статуса
        echo "📊 Container status:"
        docker-compose -f $COMPOSE_FILE ps
        
        # Проверка логов на ошибки
        echo "📋 Checking logs for errors..."
        docker-compose -f $COMPOSE_FILE logs --tail=50
        
        echo "========================================="
        echo "✅ Deployment completed successfully"
        echo "========================================="
        DEPLOY_SCRIPT
        
        chmod +x deploy-package/deploy.sh
        
        # Создаем .env файл
        cat > deploy-package/.env << EOF
        # Generated on $(date)
        PROJECT_NAME=${{ env.PROJECT_NAME }}
        ENVIRONMENT=${{ steps.vars.outputs.environment }}
        NODE_ENV=${{ steps.vars.outputs.environment }}
        EOF
        
        # Создаем архив
        echo "📦 Creating deployment archive..."
        cd deploy-package
        tar -czf ../deploy.tar.gz .
        cd ..
        
        echo "✅ Deployment package created: deploy.tar.gz"
        echo "Archive size: $(du -h deploy.tar.gz | cut -f1)"
        
        # Выводим список файлов в архиве для отладки
        echo "Archive contents (first 20 files):"
        tar -tzf deploy.tar.gz | head -20
    
    - name: Stop old containers on server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        
        echo "🛑 Stopping old containers on server..."
        
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          $SERVER_USER@$SERVER_HOST << 'STOP_SCRIPT'
          PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
          
          cd $PROJECT_DIR 2>/dev/null || true
          
          echo "Stopping existing containers..."
          docker-compose -f docker-compose.dev.yml down --remove-orphans 2>/dev/null || true
          docker-compose -f docker-compose.yml down --remove-orphans 2>/dev/null || true
          
          echo "Cleaning up..."
          docker system prune -af 2>/dev/null || true
          
          echo "✅ Old containers stopped"
        STOP_SCRIPT
        
        echo "✅ Old containers stopped successfully"
    
    - name: Deploy to server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        
        echo "📦 Copying deployment package to $SERVER_USER@$SERVER_HOST..."
        
        # Копируем архив на сервер
        scp -P $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz \
          $SERVER_USER@$SERVER_HOST:/tmp/
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to copy deployment package"
          exit 1
        fi
        
        echo "✅ Package copied successfully"
        echo "🚀 Executing deployment script on remote server..."
        
        # Выполняем деплой
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          $SERVER_USER@$SERVER_HOST << REMOTE_SCRIPT
          set -e
          
          PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
          
          echo "📁 Preparing project directory: \$PROJECT_DIR"
          
          # Очищаем директорию проекта
          rm -rf \$PROJECT_DIR/*
          mkdir -p \$PROJECT_DIR
          
          echo "📦 Extracting deployment package..."
          tar -xzf /tmp/deploy.tar.gz -C \$PROJECT_DIR
          
          cd \$PROJECT_DIR
          
          echo "Current directory: \$(pwd)"
          echo "Files in project directory:"
          ls -la
          
          # Создаем .env если его нет
          if [ ! -f .env ]; then
            cp .env.example .env 2>/dev/null || echo "No .env.example found"
          fi
          
          # Даем права на выполнение скрипта
          chmod +x deploy.sh
          
          # Запускаем деплой
          echo "🏃 Running deployment..."
          ./deploy.sh
          
          echo "✅ Deployment completed successfully"
          
          # Очистка
          rm -f /tmp/deploy.tar.gz
          
        REMOTE_SCRIPT
        
        if [ $? -ne 0 ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ Deployment script executed successfully"
    
    - name: Health check
      run: |
        echo "🔍 Running health check..."
        sleep 20
        
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        
        # Проверка через HTTP
        echo "Checking HTTP endpoint..."
        if curl -f -s -o /dev/null -w "%{http_code}" http://$SERVER_HOST | grep -q "200\|301\|302"; then
          echo "✅ Health check passed - HTTP OK"
        else
          echo "⚠️ HTTP health check failed, checking containers..."
          
          # Проверяем статус контейнеров
          ssh -p $SERVER_PORT \
            -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd $PROJECT_DIR && docker-compose ps" || echo "Failed to get container status"
        fi
        
        # Проверка Docker контейнеров
        echo "📊 Checking Docker containers..."
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST \
          "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
    
    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ SUCCESS"
          EMOJI="🎉"
        else
          STATUS="❌ FAILED"
          EMOJI="💥"
        fi
        
        echo "$EMOJI ========================================="
        echo "Deployment Status: $STATUS"
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Project: ${{ env.PROJECT_NAME }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "=========================================="