name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_COMPOSE_VERSION: '2.23.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || (github.ref == 'refs/heads/main' && 'production') || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: |
          ${{ secrets.DEV_SSH_KEY }}
          ${{ secrets.PROD_SSH_KEY }}
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version
    
    - name: Run tests
      run: |
        echo "Running tests for ${{ github.ref_name }}"
    
    - name: Set deployment variables
      id: vars
      run: |
        # Определяем окружение
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=prod" >> $GITHUB_OUTPUT
          echo "server_host=${{ secrets.PROD_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "server_user=${{ secrets.PROD_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "server_port=${{ secrets.PROD_SERVER_PORT || 22 }}" >> $GITHUB_OUTPUT
          echo "project_dir=${{ secrets.PROD_PROJECT_DIR || '/opt/app' }}" >> $GITHUB_OUTPUT
          echo "compose_files=${{ secrets.PROD_COMPOSE_FILES || '-f docker-compose.yml -f docker-compose.prod.yml' }}" >> $GITHUB_OUTPUT
        else
          echo "environment=dev" >> $GITHUB_OUTPUT
          echo "server_host=${{ secrets.DEV_SERVER_HOST }}" >> $GITHUB_OUTPUT
          echo "server_user=${{ secrets.DEV_SERVER_USER }}" >> $GITHUB_OUTPUT
          echo "server_port=${{ secrets.DEV_SERVER_PORT || 22 }}" >> $GITHUB_OUTPUT
          echo "project_dir=${{ secrets.DEV_PROJECT_DIR || '/opt/app-dev' }}" >> $GITHUB_OUTPUT
          echo "compose_files=${{ secrets.DEV_COMPOSE_FILES || '-f docker-compose.yml' }}" >> $GITHUB_OUTPUT
        fi
        
        # Проверяем что переменные установлены
        echo "=== DEPLOYMENT CONFIGURATION ==="
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Server: ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }}:${{ steps.vars.outputs.server_port }}"
        echo "Project dir: ${{ steps.vars.outputs.project_dir }}"
        echo "Compose files: ${{ steps.vars.outputs.compose_files }}"
        echo "================================"
        
        # Валидация
        if [ -z "${{ steps.vars.outputs.server_host }}" ]; then
          echo "❌ ERROR: server_host is empty! Check your GitHub secrets."
          exit 1
        fi
        if [ -z "${{ steps.vars.outputs.server_user }}" ]; then
          echo "❌ ERROR: server_user is empty! Check your GitHub secrets."
          exit 1
        fi
    
    - name: Prepare deployment package
      run: |
        # Создаем архив с необходимыми файлами
        mkdir -p deploy-package
        
        # Копируем docker-compose файлы
        cp docker-compose*.yml deploy-package/ 2>/dev/null || echo "⚠️ No docker-compose files found"
        
        # Копируем .env.example если есть
        cp .env.example deploy-package/ 2>/dev/null || echo "⚠️ No .env.example found"
        
        # Копируем deploy.sh если существует (опционально)
        if [ -f .github/scripts/deploy.sh ]; then
          cp .github/scripts/deploy.sh deploy-package/
          chmod +x deploy-package/deploy.sh
          echo "✅ deploy.sh copied"
        fi
        
        # Создаем .env из переменных окружения если есть
        echo "# Environment variables - Generated by GitHub Actions" > deploy-package/.env
        echo "APP_ENV=${{ steps.vars.outputs.environment }}" >> deploy-package/.env
        echo "DEPLOY_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> deploy-package/.env
        
        # Если есть переменные с префиксом окружения, добавляем их
        env | grep "^${{ steps.vars.outputs.environment }}_" | while read line; do
          echo "$line" | sed "s/^${{ steps.vars.outputs.environment }}_//" >> deploy-package/.env
        done || true
        
        # Архивируем
        tar -czf deploy.tar.gz -C deploy-package .
        echo "✅ Deployment package created: $(ls -lh deploy.tar.gz)"
        echo "Package contents:"
        tar -tzf deploy.tar.gz | head -10
    
    - name: Deploy to server
      run: |
        # Сохраняем переменные в локальные для удобства
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        COMPOSE_FILES="${{ steps.vars.outputs.compose_files }}"
        
        echo "🚀 Starting deployment to ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}"
        echo "📁 Project directory: ${PROJECT_DIR}"
        echo "🐳 Docker compose files: ${COMPOSE_FILES}"
        
        # Копируем архив на сервер
        echo "📦 Copying deployment package..."
        scp -P ${SERVER_PORT} \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          deploy.tar.gz \
          ${SERVER_USER}@${SERVER_HOST}:/tmp/
        
        # Выполняем деплой
        echo "🔧 Running deployment commands..."
        ssh -p ${SERVER_PORT} \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          ${SERVER_USER}@${SERVER_HOST} << EOF
            set -e
            
            echo "=== Starting deployment on server ==="
            
            # Создаем директорию проекта
            echo "Creating project directory: ${PROJECT_DIR}"
            sudo mkdir -p ${PROJECT_DIR}
            sudo chown -R \$USER:\$USER ${PROJECT_DIR}
            
            # Распаковываем архив
            echo "Extracting files..."
            tar -xzf /tmp/deploy.tar.gz -C ${PROJECT_DIR}
            
            cd ${PROJECT_DIR}
            
            # Проверяем наличие docker-compose.yml
            if [ ! -f docker-compose.yml ]; then
              echo "❌ ERROR: docker-compose.yml not found in deployment package!"
              echo "Available files:"
              ls -la
              exit 1
            fi
            
            echo "✅ Found docker-compose.yml"
            
            # Бэкап существующего .env если есть
            if [ -f .env ] && [ ! -f .env.backup ]; then
              cp .env .env.backup.\$(date +%Y%m%d_%H%M%S)
              echo "📝 Backup of .env created"
            fi
            
            # Деплой
            echo "🛑 Stopping old containers..."
            docker-compose ${COMPOSE_FILES} down || true
            
            echo "📥 Pulling latest images..."
            docker-compose ${COMPOSE_FILES} pull || true
            
            echo "🏗️  Building and starting containers..."
            docker-compose ${COMPOSE_FILES} up -d --build
            
            # Проверка статуса
            echo "🔍 Checking container status..."
            sleep 10
            docker-compose ${COMPOSE_FILES} ps
            
            # Очистка
            echo "🧹 Cleaning up..."
            docker image prune -f
            rm -f /tmp/deploy.tar.gz
            
            echo "✅ Deployment completed successfully!"
          EOF
        
        echo "🎉 Deployment script finished"
    
    - name: Health check
      run: |
        echo "⏳ Waiting for services to be ready..."
        sleep 15
        echo "🏥 Running health check for ${{ steps.vars.outputs.server_host }}"
        
        # Проверяем статус контейнеров через SSH
        ssh -p ${{ steps.vars.outputs.server_port }} \
          -o StrictHostKeyChecking=no \
          ${{ steps.vars.outputs.server_user }}@${{ steps.vars.outputs.server_host }} \
          "cd ${{ steps.vars.outputs.project_dir }} && docker-compose ps --format 'table {{.Name}}\t{{.Status}}'" || echo "⚠️ Health check failed"
    
    - name: Send notification
      if: always()
      run: |
        echo "========================================="
        echo "📢 DEPLOYMENT NOTIFICATION"
        echo "========================================="
        echo "Status: ${{ job.status }}"
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "========================================="