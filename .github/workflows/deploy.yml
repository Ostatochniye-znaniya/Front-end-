name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  # Окружение: ручной запуск - из input, push - по ветке (main = prod)
  IS_PROD: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main') }}

# Деплои одного окружения идут по очереди, dev и prod не мешают друг другу
concurrency:
  group: deploy-front-${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ ((github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'prod') || (github.event_name != 'workflow_dispatch' && github.ref == 'refs/heads/main')) && 'production' || 'development' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: Set deployment variables
      id: vars
      run: |
        if [[ "$IS_PROD" == "true" ]]; then
          ENVIRONMENT="prod"
          SERVER_HOST="${{ vars.PROD_SERVER_HOST }}"
          SERVER_USER="${{ vars.PROD_SERVER_USER }}"
          SERVER_PORT="${{ vars.PROD_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.PROD_PROJECT_DIR }}"
          NETWORK_NAME="${{ vars.PROD_NETWORK_NAME }}"
          BACKEND_HOST="${{ vars.PROD_BACKEND_HOST }}"
          HTTP_PORT="${{ vars.PROD_HTTP_PORT }}"
          [ -z "$NETWORK_NAME" ] && NETWORK_NAME="app-network-prod"
          [ -z "$BACKEND_HOST" ] && BACKEND_HOST="knowledgeapp-api"
          [ -z "$HTTP_PORT" ] && HTTP_PORT="80"
          DEFAULT_DIR="/home/oz-admin/csh/frontend"
        else
          ENVIRONMENT="dev"
          SERVER_HOST="${{ vars.DEV_SERVER_HOST }}"
          SERVER_USER="${{ vars.DEV_SERVER_USER }}"
          SERVER_PORT="${{ vars.DEV_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.DEV_PROJECT_DIR }}"
          NETWORK_NAME="${{ vars.DEV_NETWORK_NAME }}"
          BACKEND_HOST="${{ vars.DEV_BACKEND_HOST }}"
          HTTP_PORT="${{ vars.DEV_HTTP_PORT }}"
          [ -z "$NETWORK_NAME" ] && NETWORK_NAME="app-network-dev"
          [ -z "$BACKEND_HOST" ] && BACKEND_HOST="knowledgeapp-api-dev"
          [ -z "$HTTP_PORT" ] && HTTP_PORT="8080"
          DEFAULT_DIR="/home/oz-admin/csh/frontend-dev"
        fi

        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty for $ENVIRONMENT environment"
          exit 1
        fi

        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty for $ENVIRONMENT environment"
          exit 1
        fi

        if ! [[ "$HTTP_PORT" =~ ^[0-9]+$ ]]; then
          echo "❌ Error: HTTP_PORT must be a number, got '$HTTP_PORT'"
          exit 1
        fi

        [ -z "$SERVER_PORT" ] && SERVER_PORT="22"
        [ -z "$PROJECT_DIR" ] && PROJECT_DIR="$DEFAULT_DIR"

        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "server_host=$SERVER_HOST" >> $GITHUB_OUTPUT
        echo "server_user=$SERVER_USER" >> $GITHUB_OUTPUT
        echo "server_port=$SERVER_PORT" >> $GITHUB_OUTPUT
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
        echo "network_name=$NETWORK_NAME" >> $GITHUB_OUTPUT
        echo "backend_host=$BACKEND_HOST" >> $GITHUB_OUTPUT
        echo "http_port=$HTTP_PORT" >> $GITHUB_OUTPUT

        echo "=== Deployment Configuration ==="
        echo "Environment: $ENVIRONMENT"
        echo "Server: $SERVER_USER@$SERVER_HOST:$SERVER_PORT"
        echo "Project directory: $PROJECT_DIR"
        echo "Backend network: $NETWORK_NAME"
        echo "Backend host: $BACKEND_HOST"
        echo "HTTP port: $HTTP_PORT"
        echo "================================"

    - name: Setup SSH agent
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ steps.vars.outputs.environment == 'prod' && secrets.PROD_SSH_KEY || secrets.DEV_SSH_KEY }}

    - name: Prepare deployment package
      run: |
        mkdir -p deploy-package

        echo "📦 Copying project files..."

        for f in docker-compose.yml nginx.conf.template deploy.sh; do
          if [ ! -f "$f" ]; then
            echo "❌ Required file not found: $f"
            exit 1
          fi
          cp "$f" deploy-package/
          echo "✅ Copied $f"
        done

        if [ ! -d "frontend" ]; then
          echo "❌ Directory frontend not found"
          exit 1
        fi
        cp -r frontend deploy-package/
        echo "✅ Copied frontend directory"

        cat > deploy-package/.env << 'EOF'
        INSTANCE=${{ steps.vars.outputs.environment }}
        HTTP_PORT=${{ steps.vars.outputs.http_port }}
        BACKEND_HOST=${{ steps.vars.outputs.backend_host }}
        BACKEND_PORT=8080
        BACKEND_NETWORK=${{ steps.vars.outputs.network_name }}
        NETWORK_NAME=${{ steps.vars.outputs.network_name }}
        EOF

        echo "✅ Created .env file"

        cd deploy-package
        tar -czf ../deploy.tar.gz .
        cd ..

        echo "✅ Deployment package created: deploy.tar.gz"
        echo "Archive size: $(du -h deploy.tar.gz | cut -f1)"
        echo "📦 Package contents:"
        tar -tzf deploy.tar.gz | head -20

    - name: Deploy to server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"

        echo "📦 Copying deployment package to $SERVER_USER@$SERVER_HOST..."

        scp -P $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz \
          $SERVER_USER@$SERVER_HOST:/tmp/deploy-front-${{ steps.vars.outputs.environment }}.tar.gz

        echo "✅ Package copied successfully"
        echo "🚀 Executing deployment script on remote server..."

        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          $SERVER_USER@$SERVER_HOST << 'REMOTE_SCRIPT'
          set -e

          PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
          NETWORK_NAME="${{ steps.vars.outputs.network_name }}"
          ARCHIVE="/tmp/deploy-front-${{ steps.vars.outputs.environment }}.tar.gz"

          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "/" ]; then
            echo "[ERROR] Unsafe PROJECT_DIR: '$PROJECT_DIR'"
            exit 1
          fi

          echo "[INFO] Preparing project directory: $PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          if [ ! -w "$PROJECT_DIR" ]; then
            echo "[ERROR] Cannot write to $PROJECT_DIR"
            echo "Current user: $(whoami)"
            echo "Directory owner: $(stat -c '%U' "$PROJECT_DIR" 2>/dev/null || echo 'unknown')"
            echo "Directory permissions: $(stat -c '%a' "$PROJECT_DIR" 2>/dev/null || echo 'unknown')"
            exit 1
          fi

          echo "[INFO] Cleaning project directory..."
          find "$PROJECT_DIR" -mindepth 1 -delete

          echo "[INFO] Extracting deployment package..."
          tar -xzf "$ARCHIVE" -C "$PROJECT_DIR"

          cd "$PROJECT_DIR"

          echo "[INFO] Current directory: $(pwd)"
          ls -la

          if [ ! -f "deploy.sh" ]; then
            echo "[ERROR] deploy.sh not found in deployment package!"
            exit 1
          fi

          export NETWORK_NAME="$NETWORK_NAME"
          export DEPLOY_COMPOSE_FILE="docker-compose.yml"
          export CLEAN_IMAGES="false"
          export WAIT_TIME="15"

          chmod +x deploy.sh
          ./deploy.sh

          rm -f "$ARCHIVE"

        REMOTE_SCRIPT

        echo "✅ Deployment script executed successfully"

    - name: Health check
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        HTTP_PORT="${{ steps.vars.outputs.http_port }}"

        echo "🔍 Running health check on the server (port $HTTP_PORT)..."

        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          $SERVER_USER@$SERVER_HOST \
          "curl -fsSL --retry 6 --retry-delay 5 --retry-connrefused -o /dev/null -w 'HTTP %{http_code}' http://127.0.0.1:${HTTP_PORT}/csh/"
        echo ""
        echo "✅ Health check passed"

        echo "📊 Container status:"
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          $SERVER_USER@$SERVER_HOST \
          "cd ${{ steps.vars.outputs.project_dir }} && (docker compose -f docker-compose.yml ps 2>/dev/null || docker-compose -f docker-compose.yml ps 2>/dev/null || echo 'No containers running')"

        echo "🌐 Backend network:"
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          $SERVER_USER@$SERVER_HOST \
          "docker network inspect ${{ steps.vars.outputs.network_name }} --format '{{range .Containers}}{{.Name}} {{end}}' 2>/dev/null || echo 'Network not found'"

    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment SUCCESS"
          echo "🎉 Frontend deployed successfully to ${{ steps.vars.outputs.environment }} environment"
        else
          echo "❌ Deployment FAILED"
          echo "💥 Failed to deploy frontend to ${{ steps.vars.outputs.environment }} environment"
        fi
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Project: ${{ env.PROJECT_NAME }}"
        echo "Backend network: ${{ steps.vars.outputs.network_name }}"
        echo "Backend host: ${{ steps.vars.outputs.backend_host }}"
        echo "HTTP port: ${{ steps.vars.outputs.http_port }}"
        echo "Server: ${{ steps.vars.outputs.server_host }}"
        echo "Time: $(date)"
