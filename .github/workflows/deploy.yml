name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_COMPOSE_VERSION: '2.23.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || (github.ref == 'refs/heads/main' && 'production') || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup SSH agent for DEV
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
    
    - name: Setup SSH agent for PROD
      if: github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/main'
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
    
    - name: Set deployment variables
      id: vars
      run: |
        # Определяем окружение
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
          SERVER_HOST="${{ vars.PROD_SERVER_HOST }}"
          SERVER_USER="${{ vars.PROD_SERVER_USER }}"
          SERVER_PORT="${{ vars.PROD_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.PROD_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.PROD_COMPOSE_FILES }}"
        else
          ENVIRONMENT="dev"
          SERVER_HOST="${{ vars.DEV_SERVER_HOST }}"
          SERVER_USER="${{ vars.DEV_SERVER_USER }}"
          SERVER_PORT="${{ vars.DEV_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.DEV_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.DEV_COMPOSE_FILES }}"
        fi
        
        # Проверяем обязательные переменные
        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty for $ENVIRONMENT environment"
          exit 1
        fi
        
        # Устанавливаем значения по умолчанию
        SERVER_PORT="${SERVER_PORT:-22}"
        PROJECT_DIR="${PROJECT_DIR:-/opt/csh/frontend}"
        
        if [ "$ENVIRONMENT" == "prod" ]; then
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.prod.yml}"
        else
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.dev.yml}"
        fi
        
        # Сохраняем в output
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "server_host=$SERVER_HOST" >> $GITHUB_OUTPUT
        echo "server_user=$SERVER_USER" >> $GITHUB_OUTPUT
        echo "server_port=$SERVER_PORT" >> $GITHUB_OUTPUT
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
        echo "compose_files=$COMPOSE_FILES" >> $GITHUB_OUTPUT
        
        # Debug info
        echo "=== Deployment Configuration ==="
        echo "Environment: $ENVIRONMENT"
        echo "Server: $SERVER_USER@$SERVER_HOST:$SERVER_PORT"
        echo "Project directory: $PROJECT_DIR"
        echo "Compose files: $COMPOSE_FILES"
        echo "================================"
    
    - name: Prepare deployment package
      run: |
        # Создаем временную директорию для сборки
        mkdir -p deploy-package
        
        echo "📦 Copying project files..."
        
        # Копируем все необходимые файлы
        # Копируем docker-compose файлы
        if [ -f "docker-compose.dev.yml" ]; then
          cp docker-compose.dev.yml deploy-package/
          echo "✅ Copied docker-compose.dev.yml"
        fi
        
        if [ -f "docker-compose.yml" ]; then
          cp docker-compose.yml deploy-package/
          echo "✅ Copied docker-compose.yml"
        fi
        
        # Копируем nginx.conf если есть
        if [ -f "nginx.conf" ]; then
          cp nginx.conf deploy-package/
          echo "✅ Copied nginx.conf"
        fi
        
        # Копируем Makefile если есть
        if [ -f "Makefile" ]; then
          cp Makefile deploy-package/
          echo "✅ Copied Makefile"
        fi
        
        # Копируем README.md если есть
        if [ -f "README.md" ]; then
          cp README.md deploy-package/
          echo "✅ Copied README.md"
        fi
        
        # Копируем .env.example если есть
        if [ -f ".env.example" ]; then
          cp .env.example deploy-package/
          echo "✅ Copied .env.example"
        fi
        
        # Копируем папку frontend
        if [ -d "frontend" ]; then
          cp -r frontend deploy-package/
          echo "✅ Copied frontend directory"
        fi
        
        # Создаем улучшенный скрипт деплоя
        cat > deploy-package/deploy.sh << 'DEPLOY_SCRIPT'
        #!/bin/bash
        
        set -e
        
        # Цвета для вывода
        RED='\033[0;31m'
        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        NC='\033[0m'
        
        log_info() {
            echo -e "${GREEN}[INFO]${NC} $1"
        }
        
        log_warn() {
            echo -e "${YELLOW}[WARN]${NC} $1"
        }
        
        log_error() {
            echo -e "${RED}[ERROR]${NC} $1"
        }
        
        # Определяем команду docker-compose
        if command -v docker-compose &> /dev/null; then
            DOCKER_COMPOSE_CMD="docker-compose"
        elif docker compose version &> /dev/null; then
            DOCKER_COMPOSE_CMD="docker compose"
        else
            log_error "Docker Compose не установлен"
            exit 1
        fi
        
        log_info "Используется команда: $DOCKER_COMPOSE_CMD"
        
        # Проверяем наличие compose файла
        if [ -f "docker-compose.dev.yml" ]; then
            COMPOSE_FILE="docker-compose.dev.yml"
        elif [ -f "docker-compose.yml" ]; then
            COMPOSE_FILE="docker-compose.yml"
        else
            log_error "docker-compose файл не найден"
            exit 1
        fi
        
        log_info "Используется compose файл: $COMPOSE_FILE"
        
        # Проверяем наличие папки frontend
        if [ ! -d "frontend" ]; then
            log_error "Папка frontend не найдена"
            exit 1
        fi
        
        # Проверяем наличие Dockerfile
        if [ ! -f "frontend/Dockerfile" ]; then
            log_error "Dockerfile не найден в папке frontend"
            ls -la frontend/
            exit 1
        fi
        
        # Останавливаем старые контейнеры
        log_info "Остановка старых контейнеров..."
        $DOCKER_COMPOSE_CMD -f $COMPOSE_FILE down --remove-orphans || true
        
        # Очистка старых образов
        log_info "Очистка старых образов..."
        docker system prune -af || true
        
        # Сборка и запуск
        log_info "Сборка и запуск контейнеров..."
        $DOCKER_COMPOSE_CMD -f $COMPOSE_FILE up -d --build --force-recreate
        
        # Ожидание запуска
        log_info "Ожидание запуска контейнеров..."
        sleep 15
        
        # Проверка статуса
        log_info "Статус контейнеров:"
        $DOCKER_COMPOSE_CMD -f $COMPOSE_FILE ps
        
        # Проверка логов
        log_info "Логи (последние 50 строк):"
        $DOCKER_COMPOSE_CMD -f $COMPOSE_FILE logs --tail=50
        
        log_info "✅ Деплой успешно завершен!"
        DEPLOY_SCRIPT
        
        chmod +x deploy-package/deploy.sh
        
        # Создаем .env файл
        cat > deploy-package/.env << EOF
        # Generated on $(date)
        PROJECT_NAME=${{ env.PROJECT_NAME }}
        ENVIRONMENT=${{ steps.vars.outputs.environment }}
        NODE_ENV=${{ steps.vars.outputs.environment }}
        EOF
        
        # Создаем архив
        echo "📦 Creating deployment archive..."
        cd deploy-package
        tar -czf ../deploy.tar.gz .
        cd ..
        
        echo "✅ Deployment package created"
        echo "Archive size: $(du -h deploy.tar.gz | cut -f1)"
        
        # Выводим содержимое архива для отладки
        echo "Archive contents:"
        tar -tzf deploy.tar.gz | head -20
    
    - name: Deploy to server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        
        echo "📦 Copying deployment package to $SERVER_USER@$SERVER_HOST..."
        
        # Копируем архив на сервер
        scp -P $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz \
          $SERVER_USER@$SERVER_HOST:/tmp/
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to copy deployment package"
          exit 1
        fi
        
        echo "✅ Package copied successfully"
        echo "🚀 Executing deployment script on remote server..."
        
        # Выполняем деплой
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          $SERVER_USER@$SERVER_HOST << REMOTE_SCRIPT
          set -e
          
          PROJECT_DIR="$PROJECT_DIR"
          
          echo "[INFO] Preparing project directory: \$PROJECT_DIR"
          
          # Очищаем директорию проекта
          sudo rm -rf \$PROJECT_DIR/*
          sudo mkdir -p \$PROJECT_DIR
          sudo chown -R \$(whoami):\$(whoami) \$PROJECT_DIR
          
          echo "[INFO] Extracting deployment package..."
          tar -xzf /tmp/deploy.tar.gz -C \$PROJECT_DIR
          
          cd \$PROJECT_DIR
          
          echo "[INFO] Current directory: \$(pwd)"
          echo "[INFO] Directory structure:"
          ls -la
          
          # Проверяем наличие deploy.sh
          if [ ! -f "deploy.sh" ]; then
            echo "[ERROR] deploy.sh not found!"
            exit 1
          fi
          
          # Делаем скрипт исполняемым
          chmod +x deploy.sh
          
          # Проверяем наличие compose файла
          if [ ! -f "docker-compose.dev.yml" ]; then
            echo "[ERROR] docker-compose.dev.yml not found!"
            echo "Available files:"
            ls -la
            exit 1
          fi
          
          # Проверяем наличие папки frontend
          if [ ! -d "frontend" ]; then
            echo "[ERROR] frontend directory not found!"
            exit 1
          fi
          
          # Проверяем наличие Dockerfile
          if [ ! -f "frontend/Dockerfile" ]; then
            echo "[ERROR] Dockerfile not found in frontend directory!"
            echo "Files in frontend:"
            ls -la frontend/
            exit 1
          fi
          
          echo "[INFO] All required files found, starting deployment..."
          
          # Запускаем деплой
          ./deploy.sh
          
          echo "[INFO] Deployment completed successfully"
          
          # Очистка
          rm -f /tmp/deploy.tar.gz
          
        REMOTE_SCRIPT
        
        if [ $? -ne 0 ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ Deployment script executed successfully"
    
    - name: Health check
      run: |
        echo "🔍 Running health check..."
        sleep 20
        
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        
        # Проверка через HTTP
        echo "Checking HTTP endpoint..."
        if curl -f -s -o /dev/null -w "%{http_code}" http://$SERVER_HOST | grep -q "200\|301\|302"; then
          echo "✅ Health check passed - HTTP OK"
        else
          echo "⚠️ HTTP health check failed, checking containers..."
          
          # Проверяем статус контейнеров
          ssh -p $SERVER_PORT \
            -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd $PROJECT_DIR && docker-compose ps" || echo "Failed to get container status"
        fi
        
        # Проверка Docker контейнеров
        echo "📊 Checking Docker containers..."
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST \
          "docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}'"
    
    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ SUCCESS"
          EMOJI="🎉"
        else
          STATUS="❌ FAILED"
          EMOJI="💥"
        fi
        
        echo "$EMOJI ========================================="
        echo "Deployment Status: $STATUS"
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Project: ${{ env.PROJECT_NAME }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "=========================================="