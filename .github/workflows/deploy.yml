name: Universal Deploy

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
          - deploy
          - rollback

env:
  PROJECT_NAME: ${{ github.event.repository.name }}
  DOCKER_COMPOSE_VERSION: '2.23.0'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    environment: ${{ github.event.inputs.environment == 'prod' && 'production' || (github.ref == 'refs/heads/main' && 'production') || 'development' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Setup SSH agent for DEV
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
    
    - name: Setup SSH agent for PROD
      if: github.event.inputs.environment == 'prod' || github.ref == 'refs/heads/main'
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
    
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Install Docker Compose
      run: |
        sudo curl -L "https://github.com/docker/compose/releases/download/v${DOCKER_COMPOSE_VERSION}/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version
    
    - name: Run tests
      run: |
        echo "Running tests for ${{ github.ref_name }}"
        # Здесь ваши тесты
    
    - name: Set deployment variables
      id: vars
      run: |
        # Определяем окружение
        if [[ "${{ github.event.inputs.environment }}" == "prod" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
          ENVIRONMENT="prod"
          SERVER_HOST="${{ vars.PROD_SERVER_HOST }}"
          SERVER_USER="${{ vars.PROD_SERVER_USER }}"
          SERVER_PORT="${{ vars.PROD_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.PROD_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.PROD_COMPOSE_FILES }}"
        else
          ENVIRONMENT="dev"
          SERVER_HOST="${{ vars.DEV_SERVER_HOST }}"
          SERVER_USER="${{ vars.DEV_SERVER_USER }}"
          SERVER_PORT="${{ vars.DEV_SERVER_PORT }}"
          PROJECT_DIR="${{ vars.DEV_PROJECT_DIR }}"
          COMPOSE_FILES="${{ vars.DEV_COMPOSE_FILES }}"
        fi
        
        # Проверяем обязательные переменные
        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty for $ENVIRONMENT environment"
          echo "Please add ${ENVIRONMENT}_SERVER_HOST to GitHub Variables"
          exit 1
        fi
        
        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty for $ENVIRONMENT environment"
          echo "Please add ${ENVIRONMENT}_SERVER_USER to GitHub Variables"
          exit 1
        fi
        
        # Устанавливаем значения по умолчанию
        SERVER_PORT="${SERVER_PORT:-22}"
        PROJECT_DIR="${PROJECT_DIR:-/opt/csh/frontend}"
        
        if [ "$ENVIRONMENT" == "prod" ]; then
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.yml -f docker-compose.prod.yml}"
        else
          COMPOSE_FILES="${COMPOSE_FILES:--f docker-compose.yml -f docker-compose.dev.yml}"
        fi
        
        # Сохраняем в output
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
        echo "server_host=$SERVER_HOST" >> $GITHUB_OUTPUT
        echo "server_user=$SERVER_USER" >> $GITHUB_OUTPUT
        echo "server_port=$SERVER_PORT" >> $GITHUB_OUTPUT
        echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT
        echo "compose_files=$COMPOSE_FILES" >> $GITHUB_OUTPUT
        
        # Debug info
        echo "=== Deployment Configuration ==="
        echo "Environment: $ENVIRONMENT"
        echo "Server: $SERVER_USER@$SERVER_HOST:$SERVER_PORT"
        echo "Project directory: $PROJECT_DIR"
        echo "Compose files: $COMPOSE_FILES"
        echo "================================"
    
    - name: Prepare deployment package
      run: |
        # Создаем временную директорию для сборки
        mkdir -p deploy-package
        
        # Копируем все файлы проекта, исключая ненужные
        echo "📦 Copying project files..."
        
        # Создаем временный архив всех файлов (исключая ненужные)
        tar -czf temp-project.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.env' \
          --exclude='deploy-package' \
          --exclude='deploy.tar.gz' \
          --exclude='.github' \
          --exclude='*.log' \
          --exclude='dist' \
          --exclude='build' \
          .
        
        # Распаковываем в deploy-package
        tar -xzf temp-project.tar.gz -C deploy-package/
        rm temp-project.tar.gz
        
        echo "✅ Project files copied"
        
        # Создаем скрипт деплоя (как выше)
        # ... остальной код
        
        # Архивируем для деплоя
        tar -czf deploy.tar.gz -C deploy-package .
        
        echo "📦 Deployment package created: deploy.tar.gz"
        echo "Archive size:"
        ls -lh deploy.tar.gz
        
        echo "First 20 files in archive:"
        tar -tzf deploy.tar.gz | head -20
    
    - name: Deploy to server
      run: |
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        COMPOSE_FILES="${{ steps.vars.outputs.compose_files }}"
        
        # Проверяем наличие переменных
        if [ -z "$SERVER_HOST" ]; then
          echo "❌ Error: SERVER_HOST is empty"
          exit 1
        fi
        
        if [ -z "$SERVER_USER" ]; then
          echo "❌ Error: SERVER_USER is empty"
          exit 1
        fi
        
        echo "📦 Copying deployment package to $SERVER_USER@$SERVER_HOST..."
        
        # Копируем архив на сервер
        scp -P $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          deploy.tar.gz \
          $SERVER_USER@$SERVER_HOST:/tmp/
        
        if [ $? -ne 0 ]; then
          echo "❌ Failed to copy deployment package"
          exit 1
        fi
        
        echo "✅ Package copied successfully"
        echo "🚀 Executing deployment script on remote server..."
        
        # Выполняем деплой - исправленная версия с правильной передачей compose files
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          -o ConnectTimeout=30 \
          $SERVER_USER@$SERVER_HOST << 'REMOTE_SCRIPT'
          set -e
          
          PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
          
          echo "📁 Preparing project directory: $PROJECT_DIR"
          
          # Создаем директорию (если не существует)
          mkdir -p "$PROJECT_DIR"
          
          # Проверяем права на запись
          if [ ! -w "$PROJECT_DIR" ]; then
            echo "❌ No write permission to $PROJECT_DIR"
            echo "Current user: $(whoami)"
            echo "Directory owner: $(stat -c '%U' $PROJECT_DIR 2>/dev/null || echo 'unknown')"
            echo "Directory permissions: $(stat -c '%a' $PROJECT_DIR 2>/dev/null || echo 'unknown')"
            echo ""
            echo "Please run on server to fix permissions:"
            echo "  sudo mkdir -p $PROJECT_DIR"
            echo "  sudo chown -R $(whoami):$(whoami) $PROJECT_DIR"
            echo "  chmod 755 $PROJECT_DIR"
            exit 1
          fi
          
          echo "✅ Directory ready: $PROJECT_DIR"
          echo "📦 Extracting deployment package..."
          tar -xzf /tmp/deploy.tar.gz -C "$PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          
          # Бэкап существующего .env
          if [ -f .env ] && [ ! -f .env.backup ]; then
            cp .env .env.backup.$(date +%Y%m%d_%H%M%S)
            echo "💾 Created backup of existing .env"
          fi
          
          # Восстанавливаем .env если был сохранен
          if [ -f .env.saved ] && [ ! -f .env ]; then
            cp .env.saved .env
            echo "💾 Restored .env from saved"
          fi
          
          # Проверяем наличие docker-compose файлов
          echo "📋 Available docker-compose files:"
          ls -la docker-compose*.yml 2>/dev/null || echo "  No docker-compose files found"
          
          # Проверяем Docker доступность
          echo "🔍 Checking Docker..."
          if ! docker info > /dev/null 2>&1; then
            echo "⚠️  Docker permission issue detected"
            echo "Current groups: $(groups)"
            echo ""
            echo "To fix Docker permissions, run on server:"
            echo "  sudo usermod -aG docker $(whoami)"
            echo "  # Then logout and login again"
            echo ""
            echo "Attempting to continue anyway..."
          else
            echo "✅ Docker is available"
          fi
          
          # Исправленный скрипт деплоя с правильным использованием compose files
          cat > deploy_fixed.sh << 'DEPLOY_SCRIPT'
          #!/bin/bash
          set -e
          
          echo "🚀 Starting deployment..."
          
          # Проверка Docker
          if ! command -v docker &> /dev/null; then
              echo "❌ Docker is not installed"
              exit 1
          fi
          
          if ! command -v docker-compose &> /dev/null; then
              echo "❌ Docker Compose is not installed"
              exit 1
          fi
          
          # Используем compose files из переменной окружения
          COMPOSE_CMD="docker-compose $COMPOSE_FILES"
          echo "Running: $COMPOSE_CMD"
          
          # Остановка существующих контейнеров
          echo "📦 Stopping existing containers..."
          eval "$COMPOSE_CMD down" || true
          
          # Pull latest images
          echo "📥 Pulling latest images..."
          eval "$COMPOSE_CMD pull" || true
          
          # Запуск контейнеров
          echo "🚀 Starting containers..."
          eval "$COMPOSE_CMD up -d --build"
          
          # Ожидание и проверка
          echo "⏳ Waiting for containers to start..."
          sleep 10
          
          # Проверка статуса
          echo "📊 Container status:"
          eval "$COMPOSE_CMD ps"
          
          # Очистка
          echo "🧹 Cleaning up..."
          docker image prune -f
          
          echo "✅ Deployment completed successfully"
          DEPLOY_SCRIPT
          
          chmod +x deploy_fixed.sh
          
          # Устанавливаем переменные окружения для docker-compose
          # Важно: COMPOSE_FILES должна быть строкой с флагами
          export COMPOSE_FILES="${{ steps.vars.outputs.compose_files }}"
          
          echo "🔧 Deployment configuration:"
          echo "  Compose files: $COMPOSE_FILES"
          echo "  Docker command: docker-compose $COMPOSE_FILES"
          
          # Выполняем деплой
          echo "🏃 Running deployment..."
          ./deploy_fixed.sh
          
          echo "✅ Deployment completed successfully"
          
          # Очистка
          rm -f /tmp/deploy.tar.gz
          rm -f deploy_fixed.sh
          
        REMOTE_SCRIPT
        
        if [ $? -ne 0 ]; then
          echo "❌ Deployment failed"
          exit 1
        fi
        
        echo "✅ Deployment script executed successfully"
    
    - name: Health check
      run: |
        echo "🔍 Running health check..."
        sleep 15
        
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        COMPOSE_FILES="${{ steps.vars.outputs.compose_files }}"
        
        # Проверка через HTTP
        if curl -f -s -o /dev/null -w "%{http_code}" http://$SERVER_HOST | grep -q "200\|301\|302"; then
          echo "✅ Health check passed - HTTP OK"
        else
          echo "⚠️ HTTP health check failed"
          
          # Проверяем статус контейнеров
          echo "📊 Checking container status..."
          ssh -p $SERVER_PORT \
            -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd $PROJECT_DIR && docker-compose $COMPOSE_FILES ps" || echo "Failed to get container status"
          
          # Проверяем логи
          echo "📋 Last 20 lines of logs:"
          ssh -p $SERVER_PORT \
            -o StrictHostKeyChecking=no \
            $SERVER_USER@$SERVER_HOST \
            "cd $PROJECT_DIR && docker-compose $COMPOSE_FILES logs --tail=20" || echo "Failed to get logs"
        fi
    
    - name: Send notification
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          STATUS="✅ SUCCESS"
          EMOJI="🎉"
        else
          STATUS="❌ FAILED"
          EMOJI="💥"
        fi
        
        echo "$EMOJI ========================================="
        echo "Deployment Status: $STATUS"
        echo "Environment: ${{ steps.vars.outputs.environment }}"
        echo "Project: ${{ env.PROJECT_NAME }}"
        echo "Repository: ${{ github.repository }}"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        echo "Triggered by: ${{ github.actor }}"
        echo "Workflow URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        echo "=========================================="
    
    - name: Rollback
      if: github.event.inputs.action == 'rollback' && always()
      run: |
        echo "🔄 Performing rollback..."
        
        SERVER_HOST="${{ steps.vars.outputs.server_host }}"
        SERVER_PORT="${{ steps.vars.outputs.server_port }}"
        SERVER_USER="${{ steps.vars.outputs.server_user }}"
        PROJECT_DIR="${{ steps.vars.outputs.project_dir }}"
        COMPOSE_FILES="${{ steps.vars.outputs.compose_files }}"
        
        ssh -p $SERVER_PORT \
          -o StrictHostKeyChecking=no \
          $SERVER_USER@$SERVER_HOST << ROLLBACK_SCRIPT
            cd $PROJECT_DIR
            
            # Находим последний бэкап .env
            BACKUP_FILE=\$(ls -t .env.backup.* 2>/dev/null | head -n1)
            if [ -n "\$BACKUP_FILE" ]; then
              cp "\$BACKUP_FILE" .env
              echo "✅ Restored .env from \$BACKUP_FILE"
            fi
            
            # Откат до предыдущей версии
            echo "🔄 Rolling back containers..."
            docker-compose $COMPOSE_FILES down
            docker-compose $COMPOSE_FILES up -d
            
            echo "✅ Rollback completed"
        ROLLBACK_SCRIPT
