# .github/workflows/test-ssh.yml
name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test-ssh:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH agent for DEV
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEV_SSH_KEY }}
          
      - name: Test DEV connection
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.DEV_SERVER_USER }}@${{ secrets.DEV_SERVER_HOST }} "echo '✅ DEV connection successful' && docker --version"
          
      - name: Setup SSH agent for PROD
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_KEY }}
          
      - name: Test PROD connection
        run: |
          ssh -o StrictHostKeyChecking=no -p 22 ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} "echo '✅ PROD connection successful' && docker --version"