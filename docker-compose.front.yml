version: '3.8'

services:
  nextjs:
    build: ./frontend
    container_name: nextjs-app
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://localhost
    expose:
      - "3000"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "3306:3306"
    volumes:
      - ./nginx/nginx-front.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      nextjs:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    name: app-network
    external: true